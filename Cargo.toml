[workspace]
members = [
  "crates/engine",
  "crates/ffmpeg",
  "crates/server",
  "crates/wasm",
  "crates/local",
  "crates/bench",
  "crates/generators",
  "crates/macros",
  "crates/gpu",
  "crates/text",
]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lumiscia/lumen-oss"

[profile.release]
lto = true
codegen-units = 1
