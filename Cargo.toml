[workspace]
members = [
  "crates/engine",
  "crates/ffmpeg",
  "crates/server",
  "crates/wasm",
  "crates/local",
  "crates/bench",
  "crates/generators",
  "crates/macros",
  "crates/gpu",
  "crates/text",
  "crates/3d",
]

resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lumiscia/lumen-oss"

[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
lumen-3d = { package = "lumen-engine-3d", path = "crates/3d", version = "0.5.1" }
lumen-engine = { path = "crates/engine", version = "0.5.1" }
lumen-ffmpeg = { package = "lumen-engine-ffmpeg", path = "crates/ffmpeg", version = "0.5.1" }
lumen-gpu = { package = "lumen-engine-gpu", path = "crates/gpu", version = "0.5.1" }
lumen-macros = { package = "lumen-engine-macros", path = "crates/macros", version = "0.5.1" }
lumen-server = { path = "crates/server", version = "0.5.1" }
lumen-text = { package = "lumen-engine-text", path = "crates/text", version = "0.5.1" }
