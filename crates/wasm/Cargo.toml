[package]
name = "lumen-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# KTX2 is left out: its transcoder adds about 350 KB to the brotli-compressed wasm.
default = ["3d", "3d-meshopt", "3d-draco", "3d-webp"]
"3d" = ["lumen-engine/3d", "dep:lumen-3d"]
"3d-draco" = ["3d", "lumen-engine/3d-draco"]
"3d-meshopt" = ["3d", "lumen-engine/3d-meshopt"]
"3d-ktx2" = ["3d", "lumen-engine/3d-ktx2"]
"3d-webp" = ["3d", "lumen-engine/3d-webp"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "OffscreenCanvas",
  "VideoFrame",
  "console",
] }

lumen-engine = { workspace = true }
lumen-3d = { workspace = true, optional = true }
lumen-gpu = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasm-tracing = "2.1.0"
