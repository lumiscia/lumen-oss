[package]
name = "lumen-wasm"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["json"]
json = ["lumen-engine/json"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "OffscreenCanvas",
  "VideoFrame",
  "console",
] }

lumen-engine = { path = "../engine" }
lumen-gpu = { package = "lumen-engine-gpu", path = "../gpu" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasm-tracing = "2.1.0"
