[package]
name = "lumen-generators"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "lumen_generators"
path = "src/lib.rs"

[[bin]]
name = "lumen-generators"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
jsonschema = { version = "0.46.3", default-features = false }
lumen-engine = { path = "../engine", features = ["json", "metadata"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.23.0"
