[package]
name = "lumen-generators"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "lumen_generators"
path = "src/lib.rs"

[[bin]]
name = "lumen-generators"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
jsonschema = { version = "0.60.1", default-features = false }
lumen-engine = { workspace = true, features = ["metadata"] }
serde_json = "1.0.145"

[dev-dependencies]
# The parity tests parse compositions holding every node kind, 3D ones included.
lumen-engine = { workspace = true, features = ["3d"] }
