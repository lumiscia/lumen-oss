[package]
name = "lumen-generators"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen_generators"
path = "src/lib.rs"

[[bin]]
name = "lumen-generators"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
jsonschema = { version = "0.46.3", default-features = false }
lumen = { path = "../lumen", features = ["metadata"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.23.0"
