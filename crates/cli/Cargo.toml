[package]
name = "lumen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lumen"
path = "src/main.rs"

[features]
default = []
cuda = ["lumen-server/cuda"]
metal = ["lumen-server/metal"]
static-ffmpeg = ["lumen-ffmpeg/static"]

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.6.1", features = ["derive", "env"] }
tempfile = "3.23.0"
lumen-engine = { workspace = true, features = [
  "3d",
  "3d-draco",
  "3d-ktx2",
  "3d-meshopt",
  "3d-webp",
] }
lumen-server = { workspace = true }
lumen-ffmpeg = { workspace = true }
serde_json = "1.0.145"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }

[dev-dependencies]
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
lumen-server = { workspace = true, features = ["vulkan"] }
