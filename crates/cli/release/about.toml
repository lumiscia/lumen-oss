# The licenses deny.toml allows, for the notices build.sh writes into each binary package.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
