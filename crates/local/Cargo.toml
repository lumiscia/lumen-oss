[package]
name = "lumen-local"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "lumen-local"
path = "src/main.rs"

[features]
default = []
cuda = ["lumen-engine/cuda", "lumen-ffmpeg/cuda"]
metal = ["lumen-engine/metal", "lumen-ffmpeg/metal", "lumen-gpu/metal"]
vulkan = ["lumen-engine/vulkan", "lumen-gpu/vulkan", "lumen-ffmpeg/vulkan"]


[dependencies]
anyhow = "1.0.101"
fontdb = "0.23.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3.23.0"
lumen-engine = { path = "../engine", features = ["ffmpeg", "image", "json"] }
lumen-gpu = { package = "lumen-engine-gpu", path = "../gpu" }
lumen-ffmpeg = { package = "lumen-engine-ffmpeg", version = "0.3.1", path = "../ffmpeg", features = [
  "vulkan",
] }
pollster = "1.0.1"
serde_json = "1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
lumen-engine = { path = "../engine", features = ["vulkan"] }
