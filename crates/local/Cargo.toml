[package]
name = "lumen-local"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "lumen-local"
path = "src/main.rs"

[features]
default = []
cuda = ["lumen-server/cuda"]
metal = ["lumen-server/metal"]

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.6.1", features = ["derive", "env"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
tempfile = "3.23.0"
lumen-engine = { workspace = true }
lumen-server = { workspace = true }
lumen-ffmpeg = { workspace = true }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
lumen-server = { workspace = true, features = ["vulkan"] }

[dev-dependencies]
serde_json = "1.0.145"
