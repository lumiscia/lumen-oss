[package]
name = "lumen-engine-text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Text layout and glyph data helpers for the Lumen engine."

[lib]
name = "lumen_text"
path = "src/lib.rs"

[features]
experimental-msdf = ["dep:fdsm", "dep:fdsm-skrifa", "dep:half", "dep:nalgebra", "dep:skrifa"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
cosmic-text = { version = "0.18.2", default-features = false, features = ["std", "swash"] }
fdsm = { version = "0.8.0", optional = true }
fdsm-skrifa = { version = "0.2.0", optional = true }
half = { version = "2.7.1", optional = true }
nalgebra = { version = "0.34.1", optional = true }
skrifa = { version = "0.40.0", optional = true }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
lumen-gpu = { package = "lumen-engine-gpu", version = "0.2.2", path = "../gpu" }
pollster = "0.4.0"
