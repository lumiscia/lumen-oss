[package]
name = "lumen-engine-text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Text layout and glyph data helpers for the Lumen engine."

[lib]
name = "lumen_text"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
etagere = "0.3.0"
fdsm = "0.8.0"
image = { version = "0.25.10", default-features = false }
kurbo = "0.13.1"
foldhash = "0.2.0"
swash = { version = "0.2.10", default-features = false, features = ["scale"] }
unicode-bidi = { version = "0.3.18", default-features = false }
unicode-script = "0.5.8"
