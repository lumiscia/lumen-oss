[package]
name = "lumen-engine-text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Text layout and glyph data helpers for the Lumen engine."

[lib]
name = "lumen_text"
path = "src/lib.rs"

[features]
msdf = ["dep:fdsm", "dep:image", "dep:kurbo"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
etagere = "0.3.0"
fdsm = { version = "0.8.0", optional = true }
image = { version = "0.25.10", default-features = false, optional = true }
kurbo = { version = "0.13.1", optional = true }
swash = { version = "0.2.10", default-features = false, features = ["scale"] }
