[package]
name = "lumen-engine-3d"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scene maths, meshes and glTF models for the Lumen engine's 3D nodes."

[lib]
name = "lumen_3d"
path = "src/lib.rs"

[features]
default = ["exr"]
# Reads OpenEXR environment maps, as well as Radiance ones.
exr = ["dep:exr"]
draco = ["dep:draco-core"]
meshopt = ["dep:meshopt-pure"]
ktx2 = ["dep:basisu", "dep:ruzstd"]
webp = ["image/webp"]

[dependencies]
base64 = "0.22.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
exr = { version = "1.74.3", default-features = false, optional = true }
foldhash = "0.2.0"
glam = "0.32.1"
gltf-json = { version = "1.4.1", default-features = false, features = [
  "extensions",
  "extras",
  "names",
  "KHR_materials_emissive_strength",
  "KHR_materials_unlit",
] }
half = "2.7.1"
lyon_tessellation = "1.0.23"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
basisu = { version = "0.1.0", default-features = false, features = ["std"], optional = true }
draco-core = { version = "2.3.3", default-features = false, features = [
  "decoder",
  "edgebreaker_valence_decode",
  "legacy_bitstream_decode",
], optional = true }
meshopt-pure = { version = "1.3.0", optional = true }
ruzstd = { version = "0.7.3", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
