[package]
name = "lumen-gpu"
version = "0.1.0"
edition = "2024"

[features]
metal = ["dep:wgpu-hal", "wgpu/metal", "wgpu-hal/metal"]
vulkan = ["dep:ash", "dep:wgpu-hal", "wgpu/vulkan", "wgpu-hal/vulkan"]

[dependencies]
anyhow = "1.0.102"
ash = { version = "0.38.0", optional = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
tracing = "0.1.44"
wgpu = { version = "29.0.3", default-features = false, features = [
  "std",
  "webgpu",
  "webgl",
  "wgsl",
] }
wgpu-hal = { version = "29.0.3", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29.0.3", default-features = false, features = ["metal"] }
wgpu-hal = { version = "29.0.3", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "29.0.3", default-features = false, features = ["vulkan"] }
wgpu-hal = { version = "29.0.3", default-features = false, features = ["vulkan"] }

[dev-dependencies]
pollster = "0.4.0"
