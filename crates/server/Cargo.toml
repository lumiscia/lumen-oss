[package]
name = "lumen-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embeddable render library and local HTTP server for Lumen."

[lib]
name = "lumen_server"
path = "src/lib.rs"

[[bin]]
name = "lumen-server"
path = "src/bin/lumen-server.rs"
required-features = ["cli"]

[features]
cli = [
  "dep:axum",
  "dep:clap",
  "dep:futures-util",
  "dep:reqwest",
  "dep:subtle",
  "dep:tracing-subscriber",
  "dep:uuid",
]
metal = ["lumen-engine/metal", "lumen-ffmpeg/metal"]
vulkan = ["lumen-engine/vulkan", "lumen-gpu/vulkan", "lumen-ffmpeg/vulkan"]
cuda = ["lumen-engine/cuda", "lumen-ffmpeg/cuda"]

[dependencies]
anyhow = "1.0.101"
pollster = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"], optional = true }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
axum = { version = "0.8.7", default-features = false, features = [
  "http1",
  "json",
  "tokio",
  "ws",
], optional = true }
lumen-engine = { workspace = true, features = ["ffmpeg", "image"] }
lumen-gpu = { workspace = true }
lumen-ffmpeg = { workspace = true }
lumen-text = { workspace = true }
fontdb = "0.23.0"
reqwest = { version = "0.12.24", default-features = false, features = [
  "json",
  "rustls-tls",
], optional = true }
tempfile = "3.25.0"
clap = { version = "4.6.1", features = ["derive", "env"], optional = true }
futures-util = { version = "0.3.32", optional = true }
subtle = { version = "2.6.1", optional = true }
uuid = { version = "1.18.1", features = ["v4"], optional = true }

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["blocking"] }
