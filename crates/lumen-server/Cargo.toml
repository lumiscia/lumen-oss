[package]
name = "lumen-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen_server"
path = "src/lib.rs"

[[bin]]
name = "lumen-server"
path = "src/main.rs"

[[bin]]
name = "lumen-runpod"
path = "src/bin/lumen_runpod.rs"

[features]
default = ["renderer-skia", "decode-libav"]
renderer-vello = ["lumen/renderer-vello"]
renderer-skia = ["lumen/renderer-skia"]
skia-metal = ["lumen/skia-metal"]
skia-vulkan = ["lumen/skia-vulkan"]
decode-libav = ["dep:ffmpeg-next"]
decode-subprocess = []

[dependencies]
anyhow = "1.0.101"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
axum = { version = "0.8.8", features = ["macros"] }
tower = "0.5.3"
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
parking_lot = "0.12.5"
lumen = { path = "../lumen", default-features = false }
lru = "0.16.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.25.0"
async-stream = "0.3.6"
futures-core = "0.3.31"
image = { version = "0.25.9", default-features = false, features = ["png"] }
ffmpeg-next = { version = "8.0", optional = true }

[dev-dependencies]
http-body-util = "0.1.3"
