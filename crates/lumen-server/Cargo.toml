[package]
name = "lumen-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lumen-server"
path = "src/main.rs"

[dependencies]
ac-ffmpeg = "0.19.0"
anyhow = "1.0.98"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
viz = "0.10.0"
tokio = { version = "1.45.1", features = ["full"] }
async-trait = "0.1.88"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
crossbeam-channel = "0.5.15"
parking_lot = "0.12.4"
lumen = { "path" = "../lumen" }
