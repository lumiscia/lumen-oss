[package]
name = "lumen-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen_server"
path = "src/lib.rs"

[[bin]]
name = "lumen-server"
path = "src/main.rs"

[dependencies]
ac-ffmpeg = "0.19.0"
anyhow = "1.0.98"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
axum = { version = "0.8.1", features = ["macros"] }
tower = "0.5.2"
tokio = { version = "1.45.1", features = ["full"] }
async-trait = "0.1.88"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
crossbeam-channel = "0.5.15"
parking_lot = "0.12.4"
lumen = { "path" = "../lumen" }
lru = "0.14.0"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.13.0"
