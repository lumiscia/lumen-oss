[package]
name = "lumen-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen_server"
path = "src/lib.rs"

[[bin]]
name = "lumen-server"
path = "src/main.rs"

[[bin]]
name = "lumen-runpod"
path = "src/bin/lumen_runpod.rs"


[dependencies]
anyhow = "1.0.101"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
axum = { version = "0.8.8", features = ["macros"] }
tower = "0.5.3"
tower-http = { version = "0.6.6", features = ["cors"] }
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
lumen = { path = "../lumen", features = ["ffmpeg", "json"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tempfile = "3.25.0"
async-stream = "0.3.6"
futures-core = "0.3.31"
image = { version = "0.25.9", default-features = false, features = ["png"] }

[dev-dependencies]
http-body-util = "0.1.3"
