[package]
name = "lumen"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen"
path = "src/lib.rs"

[features]
ffmpeg = ["dep:ffmpeg-next"]
image = ["dep:image"]
json = ["dep:anyhow", "dep:serde", "dep:serde_json"]
threading = ["dep:crossbeam-channel", "dep:parking_lot"]
embed-roboto = []
webgl = ["skia-safe/gl"]
metal = ["skia-safe/metal", "dep:objc2", "dep:objc2-metal"]
vulkan = ["skia-safe/vulkan", "dep:ash"]

[dependencies]
thiserror = "2.0.18"
lumen-macros = { path = "../lumen-macros" }
skia-safe = { path = "../../../rust-skia/skia-safe", features = ["textlayout"] }
ffmpeg-next = { version = "8.0", optional = true }
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "ico",
], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
anyhow = { version = "1.0.101", optional = true }
parking_lot = { version = "0.12.3", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
smallvec = "1.15.1"
ash = { version = "0.38.0", optional = true }
objc2 = { version = "0.6.3", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
