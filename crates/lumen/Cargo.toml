[package]
name = "lumen"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen"
path = "src/lib.rs"

[features]
ffmpeg = ["dep:ffmpeg-next"]
gpu-metal = ["skia-safe/metal", "dep:objc2", "dep:objc2-metal"]
gpu-vulkan = ["skia-safe/vulkan", "dep:ash"]
json = ["dep:anyhow", "dep:serde", "dep:serde_json"]

[dependencies]
thiserror = "2.0.18"
taffy = "0.9.2"
skia-safe = { version = "0.91", features = ["textlayout"] }
ffmpeg-next = { version = "8.0", optional = true }
ash = { version = "0.38", optional = true, features = ["loaded"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
anyhow = { version = "1.0.101", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-metal = { version = "0.3.2", optional = true, features = ["MTLDevice", "MTLCommandQueue"] }
