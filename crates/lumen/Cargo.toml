[package]
name = "lumen"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen"
path = "src/lib.rs"

[features]
default = ["renderer-skia"]
renderer-skia = ["dep:skia-safe"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
taffy = "0.9.2"

# Skia renderer deps
skia-safe = { version = "0.91", optional = true, features = ["textlayout"] }

[dev-dependencies]
serde_json = "1.0.149"
