[package]
name = "lumen"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen"
path = "src/lib.rs"

[features]
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
taffy = "0.9.2"
skia-safe = { version = "0.91", features = ["textlayout"] }
ffmpeg-next = { version = "8.0", optional = true }

[dev-dependencies]
serde_json = "1.0.149"
