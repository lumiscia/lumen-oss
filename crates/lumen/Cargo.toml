[package]
name = "lumen"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen"
path = "src/lib.rs"

[features]
ffmpeg = ["dep:ffmpeg-next", "dep:lumen-ffmpeg"]
image = ["dep:image"]
json = ["dep:anyhow", "dep:serde", "dep:serde_json"]
embed-roboto = []
webgl = []
metal = ["lumen-ffmpeg?/metal", "lumen-gpu/metal"]
vulkan = ["lumen-ffmpeg?/vulkan", "lumen-gpu/vulkan"]
cuda = ["lumen-ffmpeg?/cuda"]

[dependencies]
thiserror = "2.0.18"
lumen-macros = { path = "../lumen-macros" }
ffmpeg-next = { version = "8.0", optional = true }
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "ico",
], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
anyhow = { version = "1.0.101", optional = true }
smallvec = "1.15.1"
lumen-ffmpeg = { version = "0.1.0", path = "../lumen-ffmpeg", optional = true }
lumen-gpu = { version = "0.1.0", path = "../lumen-gpu" }
lumen-text = { version = "0.1.0", path = "../lumen-text" }
bytemuck = { version = "1.25.0", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
glemu = { version = "0.1.2", default-features = false, features = ["api", "video-frame"] }
web-sys = { version = "0.3", features = ["VideoFrame", "WebGl2RenderingContext", "console"] }
