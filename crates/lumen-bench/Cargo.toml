[package]
name = "lumen-bench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
cuda = ["lumen/cuda", "lumen-ffmpeg/cuda"]
vulkan = ["lumen/vulkan", "lumen-gpu/vulkan", "lumen-ffmpeg/vulkan"]
metal = ["lumen/metal", "lumen-ffmpeg/metal"]

[dependencies]
anyhow = "1.0.101"
libc = "0.2"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
lumen = { path = "../lumen", features = ["ffmpeg", "image", "json"] }
lumen-gpu = { path = "../lumen-gpu" }
lumen-ffmpeg = { path = "../ffmpeg" }

[[bin]]
name = "lumen-bench-composition"
path = "src/bin/composition.rs"

[[bin]]
name = "lumen-bench-decode"
path = "src/bin/decode.rs"
