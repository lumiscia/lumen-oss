[package]
name = "lumen-local"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lumen-local"
path = "src/main.rs"

[features]
default = []
metal = ["lumen/metal"]


[dependencies]
anyhow = "1.0.101"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3.23.0"
lumen = { path = "../lumen", features = ["ffmpeg", "image", "json", "embed-roboto"] }
serde_json = "1.0.145"
