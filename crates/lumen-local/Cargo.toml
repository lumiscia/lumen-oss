[package]
name = "lumen-local"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lumen-local"
path = "src/main.rs"

[features]
default = []
metal = ["dep:objc2", "dep:objc2-metal", "lumen/metal", "lumen-ffmpeg/metal", "lumen-gpu/metal"]


[dependencies]
anyhow = "1.0.101"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3.23.0"
lumen = { path = "../lumen", features = ["ffmpeg", "image", "json", "embed-roboto"] }
lumen-gpu = { path = "../lumen-gpu" }
lumen-ffmpeg = { version = "0.1.0", path = "../ffmpeg", features = ["vulkan"] }
objc2 = { version = "0.6.4", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
pollster = "0.4.0"
serde_json = "1.0.145"
