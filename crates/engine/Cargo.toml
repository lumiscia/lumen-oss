[package]
name = "lumen-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core composition model and rendering orchestration for Lumen."

[lib]
name = "lumen_engine"
path = "src/lib.rs"

[features]
ffmpeg = ["dep:ffmpeg-next", "dep:lumen-ffmpeg"]
image = ["dep:image"]
json = ["dep:anyhow", "dep:serde", "dep:serde_json"]
metadata = []
webgl = []
metal = ["lumen-ffmpeg?/metal", "lumen-gpu/metal"]
vulkan = ["lumen-ffmpeg?/vulkan", "lumen-gpu/vulkan"]
cuda = ["lumen-ffmpeg?/cuda"]
experimental-msdf = ["lumen-text/experimental-msdf"]

[dependencies]
thiserror = "2.0.18"
tracing = "0.1.44"
lumen-macros = { package = "lumen-engine-macros", version = "0.1.0", path = "../macros" }
ffmpeg-next = { version = "8.0", optional = true }
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "ico",
], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
anyhow = { version = "1.0.101", optional = true }
smallvec = "1.15.1"
lumen-ffmpeg = { package = "lumen-engine-ffmpeg", version = "0.1.0", path = "../ffmpeg", optional = true }
lumen-gpu = { package = "lumen-engine-gpu", version = "0.1.0", path = "../gpu" }
lumen-text = { package = "lumen-engine-text", version = "0.1.0", path = "../text" }
bytemuck = { version = "1.25.0", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
glemu = { version = "0.1.2", default-features = false, features = ["api", "video-frame"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["VideoFrame", "WebGl2RenderingContext", "console"] }
