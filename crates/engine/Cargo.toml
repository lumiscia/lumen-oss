[package]
name = "lumen-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core composition model and rendering orchestration for Lumen."

[lib]
name = "lumen_engine"
path = "src/lib.rs"

[features]
ffmpeg = ["dep:lumen-ffmpeg"]
image = ["dep:image", "dep:tiff"]
metadata = []
metal = ["dep:objc2-metal", "lumen-ffmpeg?/metal", "lumen-gpu/metal"]
vulkan = ["lumen-ffmpeg?/vulkan", "lumen-gpu/vulkan"]
cuda = ["lumen-ffmpeg?/cuda"]
"3d" = ["dep:lumen-3d"]

[dependencies]
thiserror = "2.0.18"
tracing = "0.1.44"
lumen-macros = { workspace = true }
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "ico",
], optional = true }
tiff = { version = "0.11.3", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
serde_path_to_error = "0.1.20"
anyhow = "1.0.101"
foldhash = "0.2.0"
lyon_path = "1.0.19"
svgtypes = "0.16.1"
lumen-ffmpeg = { workspace = true, optional = true }
lumen-gpu = { workspace = true }
lumen-3d = { workspace = true, optional = true }
lumen-text = { workspace = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
objc2-metal = { version = "0.3.2", optional = true }

[dev-dependencies]
exr = { version = "1.74.3", default-features = false }
lumen-3d = { workspace = true, features = ["exr"] }
tempfile = "3.23.0"
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
pollster = "1.0.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
