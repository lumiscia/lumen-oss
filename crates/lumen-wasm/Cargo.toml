[package]
name = "lumen-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["json", "embed-roboto"]
json = ["lumen/json"]
embed-roboto = ["lumen/embed-roboto"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "VideoFrame", "console"] }

lumen = { path = "../lumen" }
lumen-gpu = { path = "../lumen-gpu" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasm-tracing = "2.1.0"
