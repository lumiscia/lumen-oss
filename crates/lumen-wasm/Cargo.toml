[package]
name = "lumen-wasm"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["staticlib"]

[features]
default = ["json"]
json = ["lumen/json"]

webgl = ["lumen/webgl"]

metal = ["lumen/metal"]
vulkan = ["lumen/vulkan"]

[dependencies]
lumen = { path = "../lumen" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
