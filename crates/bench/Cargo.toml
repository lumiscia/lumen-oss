[package]
name = "lumen-bench"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "lumen_bench"
path = "src/lib.rs"

[features]
default = []
"3d" = ["lumen-engine/3d"]
cuda = ["lumen-engine/cuda", "lumen-ffmpeg/cuda"]
vulkan = ["lumen-engine/vulkan", "lumen-gpu/vulkan", "lumen-ffmpeg/vulkan"]
metal = ["lumen-engine/metal", "lumen-ffmpeg/metal", "lumen-gpu/metal"]

[dependencies]
anyhow = "1.0.101"
fontdb = "0.23.0"
serde_json = "1"
pollster = "1.0.1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
lumen-engine = { workspace = true, features = ["ffmpeg", "image"] }
lumen-gpu = { workspace = true }
lumen-ffmpeg = { workspace = true }
lumen-text = { workspace = true }

[[bin]]
name = "lumen-bench-composition"
path = "src/bin/composition.rs"

[[bin]]
name = "lumen-bench-frame-graph"
path = "src/bin/frame_graph.rs"

[[bin]]
name = "lumen-bench-3d"
path = "src/bin/scene_3d.rs"
required-features = ["3d"]

[[bin]]
name = "lumen-bench-decode"
path = "src/bin/decode.rs"

[[bin]]
name = "lumen-bench-text"
path = "src/bin/text.rs"

[[bin]]
name = "lumen-bench-json-parse"
path = "src/bin/json_parse.rs"

[[bin]]
name = "lumen-bench-expression"
path = "src/bin/expression.rs"
