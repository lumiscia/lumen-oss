[package]
name = "lumen-engine-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU rendering infrastructure for the Lumen engine."

[features]
metal = ["dep:objc2", "dep:objc2-metal", "dep:wgpu-hal", "wgpu/metal", "wgpu-hal/metal"]
vulkan = ["dep:ash", "dep:wgpu-hal", "wgpu/vulkan", "wgpu-hal/vulkan"]

[dependencies]
anyhow = "1.0.102"
ash = { version = "0.38.0", optional = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
objc2 = { version = "0.6.4", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
tracing = "0.1.44"
wgpu = { version = "29.0.3", default-features = false, features = [
  "std",
  "webgpu",
  "webgl",
  "wgsl",
] }
wgpu-hal = { version = "29.0.3", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29.0.3", default-features = false, features = ["metal"] }
wgpu-hal = { version = "29.0.3", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "29.0.3", default-features = false, features = ["vulkan"] }
wgpu-hal = { version = "29.0.3", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "29.0.3", default-features = false, features = ["dx12"] }
wgpu-hal = { version = "29.0.3", default-features = false, features = ["dx12"] }

[dev-dependencies]
pollster = "0.4.0"
