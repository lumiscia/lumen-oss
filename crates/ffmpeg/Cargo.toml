[package]
name = "lumen-engine-ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "FFmpeg integration for media decode, encode, muxing, and GPU interop in Lumen."
build = "build.rs"

[lib]
name = "lumen_ffmpeg"
path = "src/lib.rs"

[features]
metal = ["dep:objc2", "dep:objc2-core-foundation", "dep:objc2-core-video", "dep:objc2-metal"]
vulkan = ["dep:ash"]
cuda = ["dep:cudarc"]
build-ffmpeg = ["ffmpeg-sys-next/build"]
gpl = ["ffmpeg-sys-next/build-license-gpl"]
nonfree = ["ffmpeg-sys-next/build-license-nonfree"]

[dependencies]
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = [
  "avcodec",
  "avformat",
  "swresample",
  "swscale",
] }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ash = { version = "0.38.0", optional = true }
cudarc = { version = "0.19.7", optional = true, default-features = false, features = [
  "driver",
  "dynamic-loading",
  "fallback-latest",
  "std",
  "cuda-12080",
] }
objc2 = { version = "0.6.4", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, features = [
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-video = { version = "0.3.2", optional = true, features = [
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVMetalTexture",
  "CVMetalTextureCache",
  "CVPixelBuffer",
  "CVPixelBufferPool",
  "CVReturn",
  "objc2-metal",
] }
objc2-metal = { version = "0.3.2", optional = true }
