[package]
name = "lumen-ffmpeg"
version = "0.1.0"
edition = "2024"

[lib]
name = "lumen_ffmpeg"
path = "src/lib.rs"

[features]
default = ["avcodec", "avformat", "swresample", "swscale"]
avcodec = ["ffmpeg-sys-next/avcodec"]
avformat = ["ffmpeg-sys-next/avformat", "avcodec"]
swresample = ["ffmpeg-sys-next/swresample"]
swscale = ["ffmpeg-sys-next/swscale"]
metal = ["dep:objc2", "dep:objc2-core-foundation", "dep:objc2-core-video", "dep:objc2-metal"]
vulkan = ["dep:ash"]
build-ffmpeg = ["ffmpeg-sys-next/build"]
gpl = ["ffmpeg-sys-next/build-license-gpl"]
nonfree = ["ffmpeg-sys-next/build-license-nonfree"]

[dependencies]
ffmpeg-sys-next = { version = "8.1.0", default-features = false }
libc = "0.2"
ash = { version = "0.38.0", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, features = [
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-video = { version = "0.3.2", optional = true, features = [
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVMetalTexture",
  "CVMetalTextureCache",
  "CVPixelBuffer",
  "CVPixelBufferPool",
  "CVReturn",
  "objc2-metal",
] }
objc2-metal = { version = "0.3.2", optional = true }

[[bench]]
name = "ffmpeg_cli"
harness = false
