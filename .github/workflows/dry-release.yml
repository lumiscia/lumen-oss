name: Dry Release

on:
  workflow_dispatch:
  # A full release build, so only for changes to what is published or how. The Version Packages
  # workflow starts it on its branch, which is where source changes get their dry run.
  pull_request:
    paths:
      - .github/actions/setup/**
      - .github/workflows/dry-release.yml
      - .github/workflows/publish-packages.yml
      - .cargo/config.toml
      - .changeset/config.json
      - Cargo.toml
      - crates/*/Cargo.toml
      - packages/*/package.json
      - tooling/release/**
      - package.json
      - pnpm-workspace.yaml

concurrency:
  group: dry-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Dry Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: extractions/setup-just@v3

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup
        with:
          native: "true"
          wasm-bindgen: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The version PR has already applied its changesets, so only apply what is still pending.
      # A prerelease keeps the ones it has applied in .changeset/pre.
      - name: Apply pull request changesets
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]; then
            pnpm release:version
          fi

      - name: Check release readiness
        run: |
          pending_changeset="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$pending_changeset" ]; then
            echo "Pending changeset found: $pending_changeset"
            echo "Run the Version Packages workflow and merge its PR before publishing."
            exit 1
          fi

          release_version="$(node -p "require('./packages/lumen-types/package.json').version")"
          if [ "$release_version" = "0.0.0" ]; then
            echo "Package versions are still 0.0.0. Run the Version Packages workflow before publishing."
            exit 1
          fi

          pnpm sync:cargo-version
          cargo update --workspace --locked
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            git diff --exit-code Cargo.toml Cargo.lock crates/*/Cargo.toml pnpm-lock.yaml packages/*/package.json
          fi

      - name: Dry-run release build and crate publish
        run: pnpm release:dry-run
