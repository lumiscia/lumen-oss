name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: extractions/setup-just@v3

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WASM tooling
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Check release readiness
        run: |
          pending_changeset="$(find .changeset -type f -name '*.md' ! -name README.md -print -quit)"
          if [ -n "$pending_changeset" ]; then
            echo "Pending changeset found: $pending_changeset"
            echo "Run the Version Packages workflow and merge its PR before publishing."
            exit 1
          fi

          release_version="$(node -p "require('./packages/lumen-types/package.json').version")"
          if [ "$release_version" = "0.0.0" ]; then
            echo "Package versions are still 0.0.0. Run the Version Packages workflow before publishing."
            exit 1
          fi

          pnpm sync:cargo-version
          git diff --exit-code Cargo.toml pnpm-lock.yaml packages/*/package.json
          cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Publish packages
        run: pnpm release:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Read release metadata
        id: release_metadata
        run: |
          release_version="$(node -p "require('./packages/lumen-types/package.json').version")"
          {
            echo "version=$release_version"
            echo "tag=v$release_version"
            echo "target=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Write release summary
        run: |
          release_version="${{ steps.release_metadata.outputs.version }}"

          cat > release-notes.md <<EOF
          Lumen $release_version publishes the coordinated Lumen package family to npm and crates.io.

          ## Published Packages

          npm:
          - @lumiscia/lumen-bindings@$release_version
          - @lumiscia/lumen-preview@$release_version
          - @lumiscia/lumen-react@$release_version
          - @lumiscia/lumen-sdk@$release_version
          - @lumiscia/lumen-shared@$release_version
          - @lumiscia/lumen-svelte@$release_version
          - @lumiscia/lumen-types@$release_version

          crates.io:
          - lumen-engine@$release_version
          - lumen-engine-ffmpeg@$release_version
          - lumen-engine-gpu@$release_version
          - lumen-engine-macros@$release_version
          - lumen-engine-text@$release_version
          - lumen-server@$release_version

          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag }}
          target_commitish: ${{ steps.release_metadata.outputs.target }}
          name: Lumen ${{ steps.release_metadata.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
