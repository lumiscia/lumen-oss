name: Publish Packages

on:
  workflow_dispatch:

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: extractions/setup-just@v3

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WASM tooling
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Check release readiness
        run: |
          pending_changeset="$(find .changeset -type f -name '*.md' ! -name README.md -print -quit)"
          if [ -n "$pending_changeset" ]; then
            echo "Pending changeset found: $pending_changeset"
            echo "Run the Version Packages workflow and merge its PR before publishing."
            exit 1
          fi

          release_version="$(node -p "require('./packages/lumen-types/package.json').version")"
          if [ "$release_version" = "0.0.0" ]; then
            echo "Package versions are still 0.0.0. Run the Version Packages workflow before publishing."
            exit 1
          fi

          pnpm sync:cargo-version
          git diff --exit-code Cargo.toml pnpm-lock.yaml packages/*/package.json
          cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Publish packages
        run: pnpm release:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Push release tag
        run: |
          release_version="$(node -p "require('./packages/lumen-types/package.json').version")"
          release_tag="v$release_version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin

          if git rev-parse "$release_tag" >/dev/null 2>&1; then
            echo "Release tag $release_tag already exists."
            exit 0
          fi

          git tag "$release_tag"
          git push origin "$release_tag"
