name: CLI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-cli.yml
      - crates/cli/release/**
      - packages/lumen-cli*/**

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 keeps the binaries running on glibc 2.28 and later.
          - package: lumen-cli-linux-x64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - package: lumen-cli-linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - package: lumen-cli-darwin-arm64
            runner: macos-14
            container: ""

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          dnf install -y zip nasm clang-libs
          pipx install ninja
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # clang-libs has libclang for bindgen but not the compiler's own headers.
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem $(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config autoconf automake libtool

      - uses: actions/cache@v6
        with:
          path: target/vcpkg-cache
          key: vcpkg-${{ matrix.package }}-${{ hashFiles('crates/cli/release/vcpkg.json') }}

      - name: Build lumen
        env:
          # vcpkg has no CMake and Ninja downloads for arm64 Linux.
          VCPKG_FORCE_SYSTEM_BINARIES: ${{ matrix.package == 'lumen-cli-linux-arm64' && '1' || '' }}
        run: ./crates/cli/release/build.sh

      - name: Run lumen
        run: |
          packages/${{ matrix.package }}/bin/lumen --version
          packages/${{ matrix.package }}/bin/lumen --check --composition crates/cli/demo/gradient-paints.json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: |
            packages/${{ matrix.package }}/bin
            packages/${{ matrix.package }}/licenses
          if-no-files-found: error
