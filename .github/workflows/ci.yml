name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check TypeScript workspace
        run: vp check

      - name: Test TypeScript workspace
        run: vp test

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Check Rust workspace
        run: cargo check

      - name: Test Rust workspace
        run: cargo test
