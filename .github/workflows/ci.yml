name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: extractions/setup-just@v3

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            pkg-config \
            vulkan-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WASM tooling
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Generate TypeScript artifacts
        run: just ci-typescript-artifacts

      - name: Check TypeScript workspace
        run: pnpm check

      - name: Test TypeScript workspace
        run: pnpm test

      - name: Test SDK against lumen-server
        env:
          LUMEN_GPU_FORCE_FALLBACK_ADAPTER: "1"
          LUMEN_SDK_INTEGRATION: "1"
          LUMEN_SERVER_FEATURES: "cli,vulkan"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          WGPU_ALLOW_UNDERLYING_NONCOMPLIANT_ADAPTER: "1"
          WGPU_BACKEND: vulkan
          WGPU_POWER_PREF: none
        run: |
          ls -l /usr/share/vulkan/icd.d
          vulkaninfo --summary
          pnpm test:integration

      - name: Build TypeScript workspace
        run: pnpm build

      - name: Check generated definitions
        run: just verify-definitions

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Check Rust workspace
        run: cargo check

      - name: Install CUDA toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit

      - name: Check CUDA ffmpeg crate
        run: cargo check -p lumen-engine-ffmpeg --features cuda

      - name: Test Rust workspace
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: cargo test
