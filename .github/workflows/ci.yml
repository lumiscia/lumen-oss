name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests read the caches main saves instead of each saving their own, which kept the
# repository over its cache limit. Line tables keep backtraces and make the caches smaller.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: extractions/setup-just@v3

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            pkg-config \
            vulkan-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - name: Check generated TypeScript artifacts
        run: just verify-typescript-artifacts

      - name: Build TypeScript workspace
        run: pnpm build

      - name: Load the Node bindings
        run: pnpm --filter @lumiscia/lumen-bindings test:node

      - name: Check TypeScript workspace
        run: pnpm check

      - name: Test TypeScript workspace
        run: pnpm test

      - name: Test SDK against lumen-server
        env:
          LUMEN_GPU_FORCE_FALLBACK_ADAPTER: "1"
          LUMEN_SDK_INTEGRATION: "1"
          LUMEN_SERVER_FEATURES: "cli,vulkan"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          WGPU_ALLOW_UNDERLYING_NONCOMPLIANT_ADAPTER: "1"
          WGPU_BACKEND: vulkan
          WGPU_POWER_PREF: none
        run: |
          ls -l /usr/share/vulkan/icd.d
          vulkaninfo --summary
          pnpm test:integration

      - name: Test lumen-server HTTP API
        env:
          LUMEN_GPU_FORCE_FALLBACK_ADAPTER: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          WGPU_ALLOW_UNDERLYING_NONCOMPLIANT_ADAPTER: "1"
          WGPU_BACKEND: vulkan
          WGPU_POWER_PREF: none
        run: cargo test -p lumen-server --features cli,vulkan --bin lumen-server --test http_api

  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            pkg-config \
            vulkan-tools

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Check Rust dependency licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint feature-gated lumen-server
        run: |
          cargo clippy -p lumen-server --all-targets --features cli -- -D warnings
          cargo clippy -p lumen-server --all-targets --features cli,vulkan,cuda -- -D warnings

  test:
    name: Rust tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v5

      # One cache for the three shards, which build the same thing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            pkg-config \
            vulkan-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test Rust workspace
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: cargo nextest run --partition hash:${{ matrix.shard }}/3

  # The required check. It passes only when every job above has.
  check:
    name: Check
    if: always()
    needs: [typescript, lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Check the jobs this one waits for
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "$results"
          [ "$results" = "success success success" ]

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: extractions/setup-just@v3

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript package builds
        run: pnpm -r --filter './packages/*' --filter '!@lumiscia/lumen-bindings' build

      - name: Check pure Rust crates
        run: cargo check -p lumen-engine -p lumen-engine-gpu -p lumen-generators -p lumen-engine-macros -p lumen-engine-text -p lumen-engine-3d
