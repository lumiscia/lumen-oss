name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: extractions/setup-just@v3

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            pkg-config \
            vulkan-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WASM tooling
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Check generated TypeScript artifacts
        run: just verify-typescript-artifacts

      - name: Check TypeScript workspace
        run: pnpm check

      - name: Test TypeScript workspace
        run: pnpm test

      - name: Test SDK against lumen-server
        env:
          LUMEN_GPU_FORCE_FALLBACK_ADAPTER: "1"
          LUMEN_SDK_INTEGRATION: "1"
          LUMEN_SERVER_FEATURES: "cli,vulkan"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          WGPU_ALLOW_UNDERLYING_NONCOMPLIANT_ADAPTER: "1"
          WGPU_BACKEND: vulkan
          WGPU_POWER_PREF: none
        run: |
          ls -l /usr/share/vulkan/icd.d
          vulkaninfo --summary
          pnpm test:integration

      - name: Build TypeScript workspace
        run: pnpm build

      - name: Check generated definitions
        run: just verify-definitions

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Check Rust workspace
        run: cargo check

      # The cuda feature only compiles a PTX kernel, so nvcc and the runtime headers are enough.
      # CUDA 13 is the first release that supports this runner's gcc and glibc, and it starts at sm_75.
      - name: Install nvcc
        timeout-minutes: 5
        run: |
          curl -fsSLo /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/cuda-ubuntu2604-x86_64.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y --no-install-recommends cuda-nvcc-13-4 cuda-cudart-dev-13-4
          echo /usr/local/cuda-13.4/bin >> "$GITHUB_PATH"

      - name: Check CUDA ffmpeg crate
        env:
          LUMEN_CUDA_ARCH: sm_75
        run: cargo check -p lumen-engine-ffmpeg --features cuda

      - name: Test Rust workspace
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: cargo test

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: extractions/setup-just@v3

      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript package builds
        run: pnpm -r --filter './packages/*' --filter '!@lumiscia/lumen-bindings' build

      - name: Check pure Rust crates
        run: cargo check -p lumen-engine -p lumen-engine-gpu -p lumen-generators -p lumen-engine-macros -p lumen-engine-text
