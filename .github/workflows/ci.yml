name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install just --locked
          cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Generate TypeScript artifacts
        run: just ci-typescript-artifacts

      - name: Check TypeScript workspace
        run: pnpm check

      - name: Test TypeScript workspace
        run: pnpm test

      - name: Build TypeScript workspace
        run: pnpm build

      - name: Check generated definitions
        run: just verify-definitions

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Check Rust workspace
        run: cargo check

      - name: Test Rust workspace
        run: cargo test
