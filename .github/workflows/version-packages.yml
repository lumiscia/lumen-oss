name: Version Packages

on:
  workflow_dispatch:

concurrency:
  group: version-packages
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply changesets
        run: pnpm release:version

      - name: Check for version changes
        run: |
          if git diff --quiet; then
            echo "No version changes were produced. Add a pending changeset before running this workflow."
            exit 1
          fi

      - name: Create or update version pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/main
          RELEASE_TITLE: "chore: version packages"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$RELEASE_BRANCH":"refs/remotes/origin/$RELEASE_BRANCH" || true
          git checkout -B "$RELEASE_BRANCH"
          git add .
          git commit -m "$RELEASE_TITLE"
          git push --force-with-lease=refs/heads/"$RELEASE_BRANCH" origin "$RELEASE_BRANCH"

          pr_number="$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$RELEASE_TITLE" --body "Version packages from pending changesets."
          else
            gh pr create --base main --head "$RELEASE_BRANCH" --title "$RELEASE_TITLE" --body "Version packages from pending changesets."
          fi

      - name: Trigger release branch checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/main
        run: |
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          gh workflow run dry-release.yml --ref "$RELEASE_BRANCH"
