<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    .label { fill: #6b6b6b; font-size: 12px; letter-spacing: 0.04em; }
    .node rect { fill: #ffffff; stroke: #0b0b0b; stroke-width: 1.25; }
    .node text { fill: #0b0b0b; font-size: 14px; }
    .out rect { fill: #0b0b0b; stroke: #0b0b0b; }
    .out text { fill: #ffffff; }
    .wire { fill: none; stroke: #0b0b0b; stroke-width: 1.25; }
    .fan { fill: none; stroke: #e0244f; stroke-width: 1.25; stroke-dasharray: 3 5; }
    .port { fill: #e0244f; }
    .target { fill: #0b0b0b; font-family: Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 600; }
    .sub { fill: #6b6b6b; font-size: 12px; }
  </style>

  <text class="label" x="24" y="34">composition.json</text>
  <text class="label" x="600" y="34">renders the same file</text>

  <path class="wire" d="M184 100 C 220 100, 220 150, 256 150" />
  <path class="wire" d="M184 200 C 220 200, 220 150, 256 150" />
  <path class="wire" d="M356 150 L 392 150" />

  <g class="node"><rect x="24" y="82" width="160" height="36" rx="18" /><text x="104" y="105" text-anchor="middle">background</text></g>
  <g class="node"><rect x="24" y="182" width="160" height="36" rx="18" /><text x="104" y="205" text-anchor="middle">text</text></g>
  <g class="node"><rect x="256" y="132" width="100" height="36" rx="18" /><text x="306" y="155" text-anchor="middle">merge</text></g>
  <g class="node out"><rect x="392" y="132" width="140" height="36" rx="18" /><text x="462" y="155" text-anchor="middle">media_output</text></g>

  <path class="fan" d="M532 150 C 566 150, 566 78, 600 78" />
  <path class="fan" d="M532 150 L 600 150" />
  <path class="fan" d="M532 150 C 566 150, 566 222, 600 222" />
  <circle class="port" cx="532" cy="150" r="3.5" />

  <text class="target" x="612" y="80">On a GPU.</text>
  <text class="sub" x="613" y="100">lumen CLI · Vulkan · Metal</text>
  <text class="target" x="612" y="152">In a browser.</text>
  <text class="sub" x="613" y="172">WebGPU Player · React · Svelte</text>
  <text class="target" x="612" y="224">On a server.</text>
  <text class="sub" x="613" y="244">lumen-server · POST /renders</text>
</svg>
